[server]
# Streamlit's file watcher scans every imported module; with transformers/torch loaded it
# hits optional imports (torchvision) and slows every rerun. Not needed outside development.
fileWatcherType = "none"

[theme]
base = "light"
primaryColor = "#1F3A8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5FA"
textColor = "#172033"
borderColor = "#E2E6EF"
baseRadius = "0.75rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
